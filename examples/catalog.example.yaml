apiVersion: reksicherung.1node.xyz/v1alpha2
kind: BackupCatalog
backups:
  - id: demo-app-a
    provider: gobackup
    database:
      type: sqlserver
      name: AppA
    selection:
      policy: latest
    cleanup: hold_for_review
    validation:
      semanticReview: true
  - id: demo-app-b
    provider: restic
    # Exact absolute path of one native SQL Server .bak file in each snapshot.
    backupPath: /var/opt/mssql/backup/demo-app-b.bak
    database:
      type: sqlserver
      name: AppB
    selection:
      policy: latest
    cleanup: hold_for_review
