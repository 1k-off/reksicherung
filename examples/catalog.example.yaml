apiVersion: reksicherung.1node.xyz/v1alpha2
kind: BackupCatalog
backups:
  - id: shop-production
    provider: gobackup
    database:
      type: sqlserver
      name: Shop
    selection:
      policy: latest
    cleanup: hold_for_review 
    validation:
      semanticReview: true
  - id: reporting-production
    provider: restic
    # Exact absolute path of one native SQL Server .bak file in each snapshot.
    backupPath: /var/opt/mssql/backup/reporting.bak
    database:
      type: sqlserver
      name: Reporting
    selection:
      policy: latest
    cleanup: hold_for_review 
