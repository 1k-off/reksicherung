# Operator stack: pull published images (default). Do not build unless developing.
#   See examples/compose/RUNBOOK.md and .agents/skills/reksicherung-bootstrap/SKILL.md
# Optional tag: REKSICHERUNG_IMAGE_TAG in .env (default latest).
# Developers only:
#   REKSICHERUNG_IMAGE_TAG=local docker compose -f examples/compose/docker-compose.yml build
#
# Per-backup S3/Restic credentials are NOT compose env vars — see
# docs/schemas/openbao-source-kv.md and docs/inputs.md.

name: reksicherung

services:
  openbao:
    image: openbao/openbao:2.1.0
    # Official image paths: /openbao/{config,file,logs}. Entrypoint chowns
    # those dirs for user openbao before drop-root (see docker-entrypoint.sh).
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      BAO_ADDR: http://127.0.0.1:8200
    # Entrypoint already adds -config=/openbao/config; do not pass a second -config.
    command: ["server"]
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - openbao-data:/openbao/file
    ports:
      - "127.0.0.1:8200:8200"
    networks: [reksicherung]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sql-data:/var/opt/mssql/data
      - sql-backup:/var/opt/mssql/backup
    ports:
      # Host 11433: Podman user-mode networking on this Windows host does not
      # forward container 1433 to host 1433 (8200 works). Inside compose the
      # service remains sqlserver:1433; OpenBao HOST stays sqlserver.
      - "127.0.0.1:11433:1433"
    networks: [reksicherung]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  # Isolated MySQL restore target (logical .sql/.sql.gz dumps). OPT-IN: behind
  # compose profile `mysql`, so plain `docker compose up` never starts it and
  # never needs MYSQL_ROOT_PASSWORD. Use `--profile mysql` when a catalog
  # source has database.type=mysql. The restore MCP creates
  # reksicherung_<hash> databases here; the account must be limited to
  # reksicherung\_% (see cmd/reksicherung-mcp-mysql-restore/README.md).
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # Host-only admin access for lab seeding; inside compose use mysql:3306.
      - "127.0.0.1:13306:3306"
    networks: [reksicherung]
    restart: unless-stopped
    profiles: ["mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  gobackup-mcp:
    image: ghcr.io/1k-off/reksicherung/mcp-gobackup:${REKSICHERUNG_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gobackup
    pull_policy: missing
    environment:
      REKSICHERUNG_OPENBAO_ADDR: http://openbao:8200
      REKSICHERUNG_OPENBAO_PLAINTEXT: "1"
      REKSICHERUNG_OPENBAO_TOKEN: ${REKSICHERUNG_OPENBAO_TOKEN}
      REKSICHERUNG_ARTIFACT_STAGE_DIR: ${REKSICHERUNG_ARTIFACT_STAGE_DIR:-/var/lib/reksicherung/artifacts}
      REKSICHERUNG_ARTIFACT_MAX_BYTES: ${REKSICHERUNG_ARTIFACT_MAX_BYTES:-214748364800}
    volumes:
      - artifact-stage:/var/lib/reksicherung/artifacts
    networks: [reksicherung]
    stdin_open: true
    restart: unless-stopped
    profiles: ["mcp-stdio"]

  restic-mcp:
    image: ghcr.io/1k-off/reksicherung/mcp-restic:${REKSICHERUNG_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.restic
    pull_policy: missing
    environment:
      REKSICHERUNG_OPENBAO_ADDR: http://openbao:8200
      REKSICHERUNG_OPENBAO_PLAINTEXT: "1"
      REKSICHERUNG_OPENBAO_TOKEN: ${REKSICHERUNG_OPENBAO_TOKEN}
      REKSICHERUNG_ARTIFACT_STAGE_DIR: ${REKSICHERUNG_ARTIFACT_STAGE_DIR:-/var/lib/reksicherung/artifacts}
      REKSICHERUNG_ARTIFACT_MAX_BYTES: ${REKSICHERUNG_ARTIFACT_MAX_BYTES:-214748364800}
    volumes:
      - artifact-stage:/var/lib/reksicherung/artifacts
    networks: [reksicherung]
    stdin_open: true
    restart: unless-stopped
    profiles: ["mcp-stdio"]

  sqlserver-restore-mcp:
    image: ghcr.io/1k-off/reksicherung/mcp-sqlserver-restore:${REKSICHERUNG_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.sqlserver-restore
    pull_policy: missing
    environment:
      REKSICHERUNG_OPENBAO_ADDR: http://openbao:8200
      REKSICHERUNG_OPENBAO_PLAINTEXT: "1"
      REKSICHERUNG_OPENBAO_TOKEN: ${REKSICHERUNG_OPENBAO_TOKEN}
      REKSICHERUNG_ARTIFACT_STAGE_DIR: ${REKSICHERUNG_ARTIFACT_STAGE_DIR:-/var/lib/reksicherung/artifacts}
      REKSICHERUNG_SQLSERVER_BACKUP_DIR: ${REKSICHERUNG_SQLSERVER_BACKUP_DIR:-/var/opt/mssql/backup}
      REKSICHERUNG_SQLSERVER_DATA_DIR: ${REKSICHERUNG_SQLSERVER_DATA_DIR:-/var/opt/mssql/data}
      REKSICHERUNG_ARTIFACT_MAX_BYTES: ${REKSICHERUNG_ARTIFACT_MAX_BYTES:-214748364800}
    volumes:
      - artifact-stage:/var/lib/reksicherung/artifacts
      - sql-backup:/var/opt/mssql/backup
    networks: [reksicherung]
    stdin_open: true
    restart: unless-stopped
    profiles: ["mcp-stdio"]
    depends_on: [sqlserver, openbao]

  sqlserver-inspect-mcp:
    image: ghcr.io/1k-off/reksicherung/mcp-sqlserver-inspect:${REKSICHERUNG_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.sqlserver-inspect
    pull_policy: missing
    environment:
      REKSICHERUNG_OPENBAO_ADDR: http://openbao:8200
      REKSICHERUNG_OPENBAO_PLAINTEXT: "1"
      REKSICHERUNG_OPENBAO_TOKEN: ${REKSICHERUNG_OPENBAO_TOKEN}
      # Lab/Cursor default; after restore restart with reksicherung_<hash>.
      REKSICHERUNG_SQLSERVER_DATABASE: ${REKSICHERUNG_SQLSERVER_DATABASE:-master}
    networks: [reksicherung]
    stdin_open: true
    restart: unless-stopped
    profiles: ["mcp-stdio"]
    depends_on: [sqlserver, openbao]

  mysql-restore-mcp:
    image: ghcr.io/1k-off/reksicherung/mcp-mysql-restore:${REKSICHERUNG_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mysql-restore
    pull_policy: missing
    environment:
      REKSICHERUNG_OPENBAO_ADDR: http://openbao:8200
      REKSICHERUNG_OPENBAO_PLAINTEXT: "1"
      REKSICHERUNG_OPENBAO_TOKEN: ${REKSICHERUNG_OPENBAO_TOKEN}
      REKSICHERUNG_ARTIFACT_STAGE_DIR: ${REKSICHERUNG_ARTIFACT_STAGE_DIR:-/var/lib/reksicherung/artifacts}
      REKSICHERUNG_ARTIFACT_MAX_BYTES: ${REKSICHERUNG_ARTIFACT_MAX_BYTES:-214748364800}
    volumes:
      # Logical dumps are streamed from the staged artifact; no shared DB volume.
      - artifact-stage:/var/lib/reksicherung/artifacts
    networks: [reksicherung]
    stdin_open: true
    restart: unless-stopped
    # `mysql` profile only (not mcp-stdio): depends_on mysql, itself opt-in.
    profiles: ["mysql"]
    depends_on: [mysql, openbao]

  mysql-inspect-mcp:
    image: ghcr.io/1k-off/reksicherung/mcp-mysql-inspect:${REKSICHERUNG_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mysql-inspect
    pull_policy: missing
    environment:
      REKSICHERUNG_OPENBAO_ADDR: http://openbao:8200
      REKSICHERUNG_OPENBAO_PLAINTEXT: "1"
      REKSICHERUNG_OPENBAO_TOKEN: ${REKSICHERUNG_OPENBAO_TOKEN}
      # Unset: every tool call must pass the restore run_id (recommended).
    networks: [reksicherung]
    stdin_open: true
    restart: unless-stopped
    profiles: ["mysql"]
    depends_on: [mysql, openbao]

  cleanup-reconciler:
    image: ghcr.io/1k-off/reksicherung/cli:${REKSICHERUNG_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.cli
    pull_policy: missing
    command: ["reconcile", "-registry", "/var/lib/reksicherung/runs/runs.db", "-interval", "30s"]
    environment:
      # In-network OpenBao (not host .env 127.0.0.1). PLAINTEXT=1 is lab-only.
      REKSICHERUNG_OPENBAO_ADDR: http://openbao:8200
      REKSICHERUNG_OPENBAO_PLAINTEXT: "1"
      REKSICHERUNG_OPENBAO_TOKEN: ${REKSICHERUNG_OPENBAO_TOKEN}
      REKSICHERUNG_SQLSERVER_BACKUP_DIR: ${REKSICHERUNG_SQLSERVER_BACKUP_DIR:-/var/opt/mssql/backup}
      REKSICHERUNG_SQLSERVER_DATA_DIR: ${REKSICHERUNG_SQLSERVER_DATA_DIR:-/var/opt/mssql/data}
      # database_type=mysql held/expired runs are dropped via the mysql client in
      # the cli image, using secret/reksicherung/mysql (reachable as mysql:3306).
    volumes:
      - run-registry:/var/lib/reksicherung/runs
      - sql-backup:/var/opt/mssql/backup
    networks: [reksicherung]
    restart: unless-stopped
    depends_on: [sqlserver, openbao]

networks:
  reksicherung:
    driver: bridge

volumes:
  openbao-data:
  sql-data:
  sql-backup:
  mysql-data:
  artifact-stage:
  run-registry:
