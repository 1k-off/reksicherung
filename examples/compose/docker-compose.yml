# Production-oriented operator stack. Build images from the repository root:
#   docker compose -f examples/compose/docker-compose.yml build
# Initialize OpenBao, load KV secrets (defaults + per-source + sqlserver),
# create the SQL restore login, then start.
#
# Per-backup S3/Restic credentials are NOT compose env vars — see
# docs/schemas/openbao-source-kv.md and docs/inputs.md.

name: reksicherung

services:
  openbao:
    image: openbao/openbao:2.1.0
    # Official image paths: /openbao/{config,file,logs}. Entrypoint chowns
    # those dirs for user openbao before drop-root (see docker-entrypoint.sh).
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      BAO_ADDR: http://127.0.0.1:8200
    # Entrypoint already adds -config=/openbao/config; do not pass a second -config.
    command: ["server"]
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - openbao-data:/openbao/file
    ports:
      - "127.0.0.1:8200:8200"
    networks: [reksicherung]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sql-data:/var/opt/mssql/data
      - sql-backup:/var/opt/mssql/backup
    ports:
      # Host 11433: Podman user-mode networking on this Windows host does not
      # forward container 1433 to host 1433 (8200 works). Inside compose the
      # service remains sqlserver:1433; OpenBao HOST stays sqlserver.
      - "127.0.0.1:11433:1433"
    networks: [reksicherung]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  gobackup-mcp:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gobackup
    image: reksicherung/mcp-gobackup:local
    environment:
      REKSICHERUNG_OPENBAO_ADDR: http://openbao:8200
      REKSICHERUNG_OPENBAO_PLAINTEXT: "1"
      REKSICHERUNG_OPENBAO_TOKEN: ${REKSICHERUNG_OPENBAO_TOKEN}
      REKSICHERUNG_ARTIFACT_STAGE_DIR: ${REKSICHERUNG_ARTIFACT_STAGE_DIR:-/var/lib/reksicherung/artifacts}
      REKSICHERUNG_ARTIFACT_MAX_BYTES: ${REKSICHERUNG_ARTIFACT_MAX_BYTES:-214748364800}
    volumes:
      - artifact-stage:/var/lib/reksicherung/artifacts
    networks: [reksicherung]
    stdin_open: true
    restart: unless-stopped
    profiles: ["mcp-stdio"]

  restic-mcp:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.restic
    image: reksicherung/mcp-restic:local
    environment:
      REKSICHERUNG_OPENBAO_ADDR: http://openbao:8200
      REKSICHERUNG_OPENBAO_PLAINTEXT: "1"
      REKSICHERUNG_OPENBAO_TOKEN: ${REKSICHERUNG_OPENBAO_TOKEN}
      REKSICHERUNG_ARTIFACT_STAGE_DIR: ${REKSICHERUNG_ARTIFACT_STAGE_DIR:-/var/lib/reksicherung/artifacts}
      REKSICHERUNG_ARTIFACT_MAX_BYTES: ${REKSICHERUNG_ARTIFACT_MAX_BYTES:-214748364800}
    volumes:
      - artifact-stage:/var/lib/reksicherung/artifacts
    networks: [reksicherung]
    stdin_open: true
    restart: unless-stopped
    profiles: ["mcp-stdio"]

  sqlserver-restore-mcp:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.sqlserver-restore
    image: reksicherung/mcp-sqlserver-restore:local
    environment:
      REKSICHERUNG_OPENBAO_ADDR: http://openbao:8200
      REKSICHERUNG_OPENBAO_PLAINTEXT: "1"
      REKSICHERUNG_OPENBAO_TOKEN: ${REKSICHERUNG_OPENBAO_TOKEN}
      REKSICHERUNG_ARTIFACT_STAGE_DIR: ${REKSICHERUNG_ARTIFACT_STAGE_DIR:-/var/lib/reksicherung/artifacts}
      REKSICHERUNG_SQLSERVER_BACKUP_DIR: ${REKSICHERUNG_SQLSERVER_BACKUP_DIR:-/var/opt/mssql/backup}
      REKSICHERUNG_SQLSERVER_DATA_DIR: ${REKSICHERUNG_SQLSERVER_DATA_DIR:-/var/opt/mssql/data}
      REKSICHERUNG_ARTIFACT_MAX_BYTES: ${REKSICHERUNG_ARTIFACT_MAX_BYTES:-214748364800}
    volumes:
      - artifact-stage:/var/lib/reksicherung/artifacts
      - sql-backup:/var/opt/mssql/backup
    networks: [reksicherung]
    stdin_open: true
    restart: unless-stopped
    profiles: ["mcp-stdio"]
    depends_on: [sqlserver, openbao]

  sqlserver-inspect-mcp:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.sqlserver-inspect
    image: reksicherung/mcp-sqlserver-inspect:local
    environment:
      REKSICHERUNG_OPENBAO_ADDR: http://openbao:8200
      REKSICHERUNG_OPENBAO_PLAINTEXT: "1"
      REKSICHERUNG_OPENBAO_TOKEN: ${REKSICHERUNG_OPENBAO_TOKEN}
      # Lab/Cursor default; after restore restart with reksicherung_<hash>.
      REKSICHERUNG_SQLSERVER_DATABASE: ${REKSICHERUNG_SQLSERVER_DATABASE:-master}
    networks: [reksicherung]
    stdin_open: true
    restart: unless-stopped
    profiles: ["mcp-stdio"]
    depends_on: [sqlserver, openbao]

  cleanup-reconciler:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.cli
    image: reksicherung/cli:local
    command: ["reconcile", "-registry", "/var/lib/reksicherung/runs/runs.db", "-interval", "30s"]
    environment:
      # In-network OpenBao (not host .env 127.0.0.1). PLAINTEXT=1 is lab-only.
      REKSICHERUNG_OPENBAO_ADDR: http://openbao:8200
      REKSICHERUNG_OPENBAO_PLAINTEXT: "1"
      REKSICHERUNG_OPENBAO_TOKEN: ${REKSICHERUNG_OPENBAO_TOKEN}
      REKSICHERUNG_SQLSERVER_BACKUP_DIR: ${REKSICHERUNG_SQLSERVER_BACKUP_DIR:-/var/opt/mssql/backup}
      REKSICHERUNG_SQLSERVER_DATA_DIR: ${REKSICHERUNG_SQLSERVER_DATA_DIR:-/var/opt/mssql/data}
    volumes:
      - run-registry:/var/lib/reksicherung/runs
      - sql-backup:/var/opt/mssql/backup
    networks: [reksicherung]
    restart: unless-stopped
    depends_on: [sqlserver, openbao]

networks:
  reksicherung:
    driver: bridge

volumes:
  openbao-data:
  sql-data:
  sql-backup:
  artifact-stage:
  run-registry:
