name: binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/binaries.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/binaries.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI and MCP binaries
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          ext=""
          if [[ "${GOOS}" == "windows" ]]; then
            ext=".exe"
          fi
          out="dist/${GOOS}-${GOARCH}"
          mkdir -p "${out}"

          binaries=(
            reksicherung:./cmd/reksicherung
            reksicherung-mcp-gobackup:./cmd/reksicherung-mcp-gobackup
            reksicherung-mcp-restic:./cmd/reksicherung-mcp-restic
            reksicherung-mcp-sqlserver:./cmd/reksicherung-mcp-sqlserver
            reksicherung-mcp-sqlserver-restore:./cmd/reksicherung-mcp-sqlserver-restore
          )

          for entry in "${binaries[@]}"; do
            name="${entry%%:*}"
            pkg="${entry#*:}"
            go build -trimpath -ldflags="-s -w" -o "${out}/${name}${ext}" "${pkg}"
          done

          ls -la "${out}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: reksicherung-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.goos }}-${{ matrix.goarch }}/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/reksicherung-*; do
            base="$(basename "${dir}")"
            # reksicherung-linux-amd64 → linux-amd64
            plat="${base#reksicherung-}"
            archive="release/reksicherung_${plat}"
            if [[ "${plat}" == windows-* ]]; then
              (cd "${dir}" && zip -qr "../../${archive}.zip" .)
            else
              tar -C "${dir}" -czf "${archive}.tar.gz" .
            fi
          done
          ls -la release

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
